# Quando carichi un tag «vX.Y.Z» crea (o aggiorna) la release su GitHub e allega lo ZIP dell'estensione.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlla che il tag corrisponda alla versione del manifest
        run: |
          v=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' manifest.json | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Il tag $GITHUB_REF_NAME non corrisponde a manifest.json ($v)"; exit 1; }
      - name: Prove
        run: node --test
      - name: Crea lo ZIP
        run: scripts/build-zip.sh "boards-extension-${GITHUB_REF_NAME#v}.zip"
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Boards ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "boards-extension-${GITHUB_REF_NAME#v}.zip" --clobber
